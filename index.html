
<h2 class="sr-only">Interactive FIFA World Cup 2026 knockout bracket simulator. Click Simulate to run the tournament and see a predicted winner.</h2>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-sans);}
.wrap{padding:1rem 0;}
.top-bar{display:flex;align-items:center;gap:12px;margin-bottom:1.25rem;flex-wrap:wrap;}
.top-bar h3{font-size:16px;font-weight:500;color:var(--color-text-primary);flex:1;}
.btn{font-size:13px;padding:7px 16px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:transparent;color:var(--color-text-primary);cursor:pointer;transition:background 0.15s;}
.btn:hover{background:var(--color-background-secondary);}
.btn-primary{background:#185FA5;color:#fff;border-color:#185FA5;}
.btn-primary:hover{background:#0C447C;border-color:#0C447C;}
.rounds-wrap{overflow-x:auto;padding-bottom:8px;}
.bracket{display:flex;gap:0;min-width:900px;}
.round-col{display:flex;flex-direction:column;flex:1;min-width:120px;}
.round-label{font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:0.07em;text-align:center;padding:0 4px 8px;white-space:nowrap;}
.matches-col{display:flex;flex-direction:column;justify-content:space-around;flex:1;}
.match{display:flex;flex-direction:column;gap:1px;margin:3px 2px;}
.team-slot{font-size:10.5px;padding:4px 6px;border-radius:3px;background:var(--color-background-secondary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all 0.2s;}
.team-slot.winner{background:#E6F1FB;color:#0C447C;border-color:#85B7EB;font-weight:500;}
.team-slot.loser{opacity:0.45;}
.team-slot.tbd{color:var(--color-text-tertiary);font-style:italic;}
.connector{width:8px;border-right:1px solid var(--color-border-secondary);position:relative;}
.final-section{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;flex:1;min-width:130px;}
.champion-box{background:var(--color-background-primary);border:1.5px solid #185FA5;border-radius:var(--border-radius-lg);padding:12px 14px;text-align:center;min-width:110px;}
.champ-label{font-size:10px;color:#185FA5;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:4px;}
.champ-name{font-size:15px;font-weight:500;color:var(--color-text-primary);}
.champ-flag{font-size:22px;margin-bottom:2px;}
.sim-note{font-size:11px;color:var(--color-text-tertiary);text-align:center;margin-top:12px;}
.group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:1.25rem;}
.group-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px 10px;}
.group-title{font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:5px;}
.group-team{font-size:11.5px;color:var(--color-text-primary);padding:2px 0;border-bottom:0.5px solid var(--color-border-tertiary);}
.group-team:last-child{border-bottom:none;}
.group-team.adv{font-weight:500;color:#185FA5;}
.tab-bar{display:flex;gap:4px;margin-bottom:12px;}
.tab{font-size:12px;padding:5px 12px;border-radius:20px;cursor:pointer;border:0.5px solid var(--color-border-tertiary);background:transparent;color:var(--color-text-secondary);}
.tab.active{background:#185FA5;color:#fff;border-color:#185FA5;}
#groups-view,#bracket-view{display:none;}
</style>

<div class="wrap">
  <div class="top-bar">
    <h3>FIFA World Cup 2026 — Bracket Simulator</h3>
    <button class="btn btn-primary" onclick="simulate()">Simulate tournament ↗</button>
    <button class="btn" onclick="reset()">Reset</button>
  </div>

  <div class="tab-bar">
    <button class="tab active" onclick="showTab('groups')">Group stage</button>
    <button class="tab" onclick="showTab('bracket')">Knockout bracket</button>
  </div>

  <div id="groups-view">
    <div class="group-grid" id="group-grid"></div>
    <p class="sim-note">Click "Simulate tournament" to predict group winners and advance teams to the bracket.</p>
  </div>

  <div id="bracket-view">
    <div class="rounds-wrap">
      <div class="bracket" id="bracket"></div>
    </div>
    <p class="sim-note" id="sim-note">Simulate first to see results.</p>
  </div>
</div>

<script>
const GROUPS = {
  A:["🇲🇽 Mexico","🇿🇦 South Africa","🇰🇷 South Korea","🇨🇿 Czechia"],
  B:["🇨🇦 Canada","🇧🇦 Bosnia-Herz.","🇶🇦 Qatar","🇨🇭 Switzerland"],
  C:["🇧🇷 Brazil","🇲🇦 Morocco","🇭🇹 Haiti","🏴󠁧󠁢󠁳󠁣󠁴󠁿 Scotland"],
  D:["🇺🇸 USA","🇵🇾 Paraguay","🇦🇺 Australia","🇹🇷 Türkiye"],
  E:["🇩🇪 Germany","🇨🇮 Côte d'Ivoire","🇪🇨 Ecuador","🇨🇼 Curaçao"],
  F:["🇳🇱 Netherlands","🇯🇵 Japan","🇸🇪 Sweden","🇹🇳 Tunisia"],
  G:["🇧🇪 Belgium","🇮🇷 Iran","🇳🇿 New Zealand","🇪🇬 Egypt"],
  H:["🇪🇸 Spain","🇺🇾 Uruguay","🇸🇦 Saudi Arabia","🇨🇻 Cabo Verde"],
  I:["🇫🇷 France","🇸🇳 Senegal","🇳🇴 Norway","🇮🇶 Iraq"],
  J:["🇦🇷 Argentina","🇦🇹 Austria","🇩🇿 Algeria","🇯🇴 Jordan"],
  K:["🇵🇹 Portugal","🇺🇿 Uzbekistan","🇨🇴 Colombia","🇨🇩 DR Congo"],
  L:["🏴󠁧󠁢󠁥󠁮󠁧󠁿 England","🇭🇷 Croatia","🇬🇭 Ghana","🇵🇦 Panama"]
};

const STRENGTH = {
  "🇫🇷 France":95,"🇪🇸 Spain":94,"🏴󠁧󠁢󠁥󠁮󠁧󠁿 England":88,
  "🇧🇷 Brazil":87,"🇦🇷 Argentina":86,"🇵🇹 Portugal":85,
  "🇩🇪 Germany":83,"🇳🇱 Netherlands":81,"🇧🇪 Belgium":78,
  "🇺🇾 Uruguay":75,"🇨🇴 Colombia":74,"🇲🇦 Morocco":73,
  "🇯🇵 Japan":72,"🇳🇴 Norway":71,"🇸🇪 Sweden":70,
  "🇰🇷 South Korea":68,"🇨🇭 Switzerland":67,"🇦🇺 Australia":64,
  "🇹🇷 Türkiye":65,"🇲🇽 Mexico":66,"🇨🇿 Czechia":63,
  "🇸🇳 Senegal":66,"🇮🇷 Iran":60,"🇪🇨 Ecuador":62,
  "🇵🇾 Paraguay":61,"🇦🇹 Austria":63,"🇭🇷 Croatia":67,
  "🇩🇿 Algeria":60,"🇪🇬 Egypt":59,"🇨🇮 Côte d'Ivoire":65,
  "🇬🇭 Ghana":58,"🇨🇦 Canada":60,"🇺🇸 USA":62,
  "🏴󠁧󠁢󠁳󠁣󠁴󠁿 Scotland":60,"🇿🇦 South Africa":52,"🇶🇦 Qatar":48,
  "🇸🇦 Saudi Arabia":55,"🇹🇳 Tunisia":55,"🇳🇿 New Zealand":50,
  "🇮🇶 Iraq":52,"🇧🇦 Bosnia-Herz.":58,"🇯🇴 Jordan":48,
  "🇺🇿 Uzbekistan":48,"🇨🇩 DR Congo":52,"🇵🇦 Panama":50,
  "🇨🇻 Cabo Verde":47,"🇭🇹 Haiti":43,"🇨🇼 Curaçao":42
};

let simulated = false;
let r32Teams = [], qfTeams = [], sfTeams = [], finalTeams = [], champion = null;
let r32Results = [], qfResults = [], sfResults = [], finalResult = null;

function str(t){ return STRENGTH[t] || 55; }
function matchup(a, b){
  const sa = str(a), sb = str(b);
  const total = sa + sb;
  const pA = (sa / total) * 0.72 + 0.14;
  return Math.random() < pA ? a : b;
}

function groupWinners(){
  const winners = [], runners = [], thirds = [];
  Object.values(GROUPS).forEach(teams => {
    const shuffled = [...teams].sort((a,b) => str(b)+Math.random()*15 - str(a)-Math.random()*15);
    winners.push(shuffled[0]);
    runners.push(shuffled[1]);
    thirds.push({team:shuffled[2], str: str(shuffled[2])});
  });
  thirds.sort((a,b)=>b.str-a.str);
  const best8thirds = thirds.slice(0,8).map(x=>x.team);
  return {winners, runners, best8thirds};
}

function simulate(){
  simulated = true;
  const {winners, runners, best8thirds} = groupWinners();
  const allR32 = [...winners, ...runners, ...best8thirds].slice(0,32);

  r32Teams = [];
  for(let i=0;i<16;i++) r32Teams.push([allR32[i*2], allR32[i*2+1]]);
  r32Results = r32Teams.map(([a,b]) => matchup(a,b));

  qfTeams = [];
  for(let i=0;i<8;i++) qfTeams.push([r32Results[i*2], r32Results[i*2+1]]);
  qfResults = qfTeams.map(([a,b]) => matchup(a,b));

  sfTeams = [];
  for(let i=0;i<4;i++) sfTeams.push([qfResults[i*2], qfResults[i*2+1]]);
  sfResults = sfTeams.map(([a,b]) => matchup(a,b));

  finalTeams = [[sfResults[0], sfResults[1]], [sfResults[2], sfResults[3]]];
  finalResult = [matchup(finalTeams[0][0], finalTeams[0][1]), matchup(finalTeams[1][0], finalTeams[1][1])];
  champion = matchup(finalResult[0], finalResult[1]);

  renderGroupsSimulated(winners, runners, best8thirds);
  renderBracket();
  document.getElementById('sim-note').textContent = 'Simulated result — click "Simulate tournament" again for a different outcome.';
  showTab('bracket');
}

function renderGroupsSimulated(winners, runners, thirds){
  const grid = document.getElementById('group-grid');
  grid.innerHTML = '';
  const keys = Object.keys(GROUPS);
  keys.forEach((g,i) => {
    const teams = GROUPS[g];
    const w = winners[i], r = runners[i];
    const card = document.createElement('div');
    card.className = 'group-card';
    card.innerHTML = `<div class="group-title">Group ${g}</div>` +
      teams.map(t => {
        const cls = t===w||t===r ? 'group-team adv' : 'group-team';
        const mark = t===w ? ' ✓1' : t===r ? ' ✓2' : '';
        return `<div class="${cls}">${t}${mark}</div>`;
      }).join('');
    grid.appendChild(card);
  });
}

function renderGroupsDefault(){
  const grid = document.getElementById('group-grid');
  grid.innerHTML = '';
  Object.entries(GROUPS).forEach(([g, teams]) => {
    const card = document.createElement('div');
    card.className = 'group-card';
    card.innerHTML = `<div class="group-title">Group ${g}</div>` +
      teams.map(t => `<div class="group-team">${t}</div>`).join('');
    grid.appendChild(card);
  });
}

function renderBracket(){
  const b = document.getElementById('bracket');
  b.innerHTML = '';

  const rounds = [
    {label:'Round of 32', pairs: r32Teams, results: r32Results},
    {label:'Round of 16', pairs: qfTeams, results: qfResults},
    {label:'Quarterfinals', pairs: sfTeams, results: sfResults},
    {label:'Semifinals', pairs: finalTeams, results: finalResult},
  ];

  rounds.forEach(({label, pairs, results}) => {
    const col = document.createElement('div');
    col.className = 'round-col';
    col.innerHTML = `<div class="round-label">${label}</div>`;
    const mc = document.createElement('div');
    mc.className = 'matches-col';
    pairs.forEach(([a,b], i) => {
      const winner = results[i];
      const m = document.createElement('div');
      m.className = 'match';
      m.innerHTML = `
        <div class="team-slot ${winner===a?'winner':winner?'loser':'tbd'}">${a||'TBD'}</div>
        <div class="team-slot ${winner===b?'winner':winner?'loser':'tbd'}">${b||'TBD'}</div>`;
      mc.appendChild(m);
    });
    col.appendChild(mc);
    b.appendChild(col);
  });

  const finalCol = document.createElement('div');
  finalCol.className = 'final-section';
  finalCol.innerHTML = `
    <div class="round-label" style="text-align:center;">Final</div>
    <div class="match">
      <div class="team-slot ${champion===finalResult[0]?'winner':'loser'}">${finalResult[0]||'TBD'}</div>
      <div class="team-slot ${champion===finalResult[1]?'winner':'loser'}">${finalResult[1]||'TBD'}</div>
    </div>
    <div class="champion-box">
      <div class="champ-flag">${champion ? champion.split(' ')[0] : '🏆'}</div>
      <div class="champ-label">Champion</div>
      <div class="champ-name">${champion ? champion.replace(/^\S+\s/,'') : '?'}</div>
    </div>`;
  b.appendChild(finalCol);
}

function reset(){
  simulated = false;
  r32Teams=[];qfTeams=[];sfTeams=[];finalTeams=[];champion=null;
  document.getElementById('bracket').innerHTML = '';
  document.getElementById('sim-note').textContent = 'Simulate first to see results.';
  renderGroupsDefault();
  showTab('groups');
}

function showTab(tab){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('groups-view').style.display = 'none';
  document.getElementById('bracket-view').style.display = 'none';
  if(tab==='groups'){
    document.getElementById('groups-view').style.display = 'block';
    document.querySelectorAll('.tab')[0].classList.add('active');
  } else {
    document.getElementById('bracket-view').style.display = 'block';
    document.querySelectorAll('.tab')[1].classList.add('active');
  }
}

renderGroupsDefault();
document.getElementById('groups-view').style.display = 'block';
</script>
